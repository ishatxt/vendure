<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vendure</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Type to grow a living garden. Letters sprout, sway, and bloom.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vendure">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
</head>

<body>
<div id="app">
  <canvas id="cv" aria-label="Vendure garden canvas. Type to grow a garden."></canvas>
  <div id="peers" aria-hidden="true"></div>
  <input id="inp" type="text" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="modes" role="group" aria-label="View mode">
    <button class="mode active" data-mode="type" aria-pressed="true">Type</button>
    <button class="mode" data-mode="edit" aria-pressed="false">Edit</button>
    <button class="mode" data-mode="poster" aria-pressed="false">Poster</button>
  </div>

  <div id="poster" hidden>
    <div id="panel">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div class="ptitle">Poster</div>
        <div class="psub prow" id="pinfo">1:1 &middot; 3s loop &middot; 30 fps</div>
      </div>
      <div class="pgroup">
        <div class="plabel">Words</div>
        <input id="pwords" value="in bloom" spellcheck="false" maxlength="40">
        <button id="pregrow" class="pill">Regrow garden</button>
      </div>
      <div class="pgroup">
        <div class="plabel">Garden</div>
        <div class="pslider"><label for="sdensity">Density</label><input id="sdensity" type="range" min="0.5" max="2" step="0.05" value="1"><span id="sdensityv">1.00</span></div>
        <div class="pslider"><label for="scurvy">Curvature</label><input id="scurvy" type="range" min="0.5" max="2" step="0.05" value="1"><span id="scurvyv">1.00</span></div>
        <div class="pslider"><label for="ssize">Bloom size</label><input id="ssize" type="range" min="0.6" max="1.6" step="0.05" value="1"><span id="ssizev">1.00</span></div>
        <div class="pslider"><label for="sroses">Roses</label><input id="sroses" type="range" min="0" max="2" step="0.05" value="1"><span id="srosesv">1.00</span></div>
      </div>
      <div class="pgroup">
        <div class="plabel">Motion</div>
        <div id="pmotion" class="pgrid2"></div>
      </div>
      <div class="pgroup">
        <div class="plabel">Palette</div>
        <div id="ppal" class="pgrid2"></div>
      </div>
      <div class="pgroup">
        <div class="plabel">Export</div>
        <button id="pexport" class="pill solid">Export&hellip;</button>
        <div class="pgrid2" style="margin-top:8px">
          <button id="pshare" class="pill">Share link</button>
          <button id="paspect" class="pill">1:1</button>
          <button id="pcopypng" class="pill">Copy PNG</button>
          <button id="pcopysvg" class="pill">Copy SVG</button>
          <button id="psavejson" class="pill">Save .json</button>
          <button id="ploadjson" class="pill">Load .json</button>
        </div>
        <div class="psub" id="pinfo2">1080 &times; 1080 &middot; video, GIF, PNG, SVG, PDF</div>
        <div id="pstatus"></div>
        <input type="file" id="pljson" accept="application/json,.json" hidden>
      </div>
    </div>
    <div id="stage"><canvas id="pcv" width="1080" height="1080" style="aspect-ratio: 1 / 1"></canvas></div>

    <div id="pexp" hidden>
      <div class="backdrop" id="pexpbackdrop"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Export">
        <div class="sheethead">
          <div style="display:flex;flex-direction:column;gap:4px">
            <div class="ptitle">Export</div>
            <div class="psub prow" id="pexpinfo"></div>
          </div>
          <button id="pexpclose" class="pill ghost" style="align-self:auto">Close</button>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="motion" role="tab">Motion</button>
          <button class="tab" data-tab="still" role="tab">Still</button>
        </div>
        <div class="formats" id="pexpformats"></div>
        <div class="settings" id="pexpsettings">
          <div class="field">
            <label for="pexpscale">Resolution</label>
            <select id="pexpscale">
              <option value="1">1&times; &middot; 1080</option>
              <option value="2">2&times; &middot; 2160</option>
              <option value="4">4&times; &middot; 4320</option>
            </select>
          </div>
          <div class="field" id="pexpfpswrap">
            <label for="pexpfps">Frame rate</label>
            <select id="pexpfps">
              <option value="24">24 FPS</option>
              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </div>
          <div class="field">
            <label for="pexpq">Quality</label>
            <select id="pexpq">
              <option value="standard">Standard</option>
              <option value="high" selected>High</option>
              <option value="prores">ProRes / Max</option>
            </select>
          </div>
          <div class="field">
            <label for="pexpaspect">Aspect</label>
            <select id="pexpaspect">
              <option value="1:1">1:1 &middot; Square</option>
              <option value="4:5">4:5 &middot; Portrait</option>
              <option value="16:9">16:9 &middot; Landscape</option>
              <option value="9:16">9:16 &middot; Story</option>
            </select>
          </div>
        </div>
        <div class="prog" id="pexpprog" hidden>
          <div class="progbar"><i id="pexpbar"></i></div>
          <div class="progtext" id="pexpprogtext"></div>
        </div>
        <div class="pf" id="pexpstatus"></div>
        <div class="hint" id="pexphint"></div>
      </div>
    </div>
  </div>

  <div id="bar">
    <div id="hints">
      <span class="fine">type to grow</span><span class="coarse">tap to type</span>
      <span class="coarse">tap = butterfly &middot; double-tap blooms</span>
      <span>space cuts</span>
      <span class="fine">backspace withers</span><span class="coarse">&#9003; withers</span>
      <span class="fine">enter clears</span><span class="coarse">return clears</span>
      <span id="edithint" hidden>drag to move &middot; del removes</span>
    </div>
    <div id="ctrls">
      <div id="pal"></div>
      <button class="btn" id="shareGarden">Share</button>
      <button class="btn" id="savePNG">PNG</button>
      <button class="btn" id="saveSVG">SVG</button>
    </div>
  </div>
</div>

<script type="module" src="src/app.js"></script>
<script>
  /* PWA: register the offline app-shell service worker (skipped on file://) */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
